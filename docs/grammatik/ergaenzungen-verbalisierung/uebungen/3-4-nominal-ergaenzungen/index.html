<!doctype html>
<html lang="de">
<head>
  <style>html,body{background:#12110f}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TELC Grammatik - Nominal-Ergänzungen Übungen</title>
  <link rel="stylesheet" href="../../../../styles.css" />
    <!-- TELC Navigation System -->
  <script src="../../../../topbar.js"></script>
  <script src="../../../../navigation.js"></script>
</head>
<body class="no-js doc-page">
  <!-- La barra de navegación se genera automáticamente -->
  <main class="doc-main">
    <section class="doc-hero">
      <div class="doc-hero-text reveal">
        <div class="eyebrow">3.4 Rektion der Verben</div>
        <h1>Nominal-Ergänzungen – Übungen</h1>
        <p class="lead">
          Wählen Sie eine Übung aus und bearbeiten Sie die Aufgaben.
        </p>
      </div>
    </section>

    <section class="section">
      <div class="section-head reveal">
        <h2>Übung wählen</h2>
        <p>Wählen Sie eine Übung aus den verfügbaren Übungen 9-10.</p>
      </div>
      <div class="exercise-panel reveal">
        <div class="exercise-setup">
          <div class="flashcards-field">
            <label for="exercise-select">Übung</label>
            <select id="exercise-select" disabled>
              <option value="">Bitte wählen...</option>
            </select>
          </div>
          <button class="btn primary" id="exercise-start" type="button" disabled>Starten</button>
        </div>

        <div class="exercise-content" id="exercise-content" style="display: none;">
          <div class="exercise-header" id="exercise-header"></div>
          <div class="exercise-list" id="exercise-list"></div>
          <div class="exercise-actions">
            <button class="btn ghost" id="exercise-check" type="button">Prüfen</button>
            <button class="btn ghost" id="exercise-reset" type="button">Zurücksetzen</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Grammatik – Nominal-Ergänzungen</span>
    <span>Übungen 9-10</span>
  </footer>

  <script defer src="exercise.js"></script>

  <script>
    (() => {
      document.documentElement.classList.add("no-flash");
      const storageKey = `telc-scroll:${location.pathname}${location.search}`;
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      const save = () => {
        sessionStorage.setItem(storageKey, String(window.scrollY || window.pageYOffset || 0));
      };

      const restore = () => {
        const saved = sessionStorage.getItem(storageKey);
        if (saved == null) return;
        const y = Number(saved);
        if (!Number.isNaN(y)) {
          window.scrollTo(0, y);
        }
      };

      const scheduleRestore = () => {
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore, 60);
        setTimeout(restore, 220);
      };

      window.addEventListener("pagehide", save);
      window.addEventListener("beforeunload", save);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") save();
      });
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link || !link.href) return;
        try {
          const url = new URL(link.href, location.href);
          if (url.origin === location.origin) save();
        } catch {
          return;
        }
      });

      window.addEventListener("pageshow", scheduleRestore);
      window.addEventListener("load", scheduleRestore);
    })();
  </script>

</body>
</html>

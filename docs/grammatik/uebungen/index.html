<!doctype html>
<html lang="de">
<head>
  <style>html,body{background:#12110f}</style>

    <!-- TELC Navigation System -->
  <script src="../../topbar.js"></script>
  <script src="../../navigation.js"></script>
</head>
<body class="no-js doc-page" data-md="content.md">
  <!-- La barra de navegación se genera automáticamente -->
  <main class="doc-main">
    <section class="doc-hero">
      <div class="doc-hero-text reveal">
        <div class="eyebrow">Training</div>
        <h1>Üben wie im Unterricht</h1>
        <p class="lead">
          Kurze Aufgaben, direkte Lösungen, klare Sprache.
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="../ergaenzungen-verbalisierung/rektion/index.html">Zur Rektion</a>
          <a class="btn ghost" href="../index.html">Zur Grammatik</a>
        </div>
      </div>
      <div class="doc-hero-panel reveal" style="--delay: 120ms;">
        <div class="panel-header">
          <span class="panel-title">Routine</span>
          <span class="panel-sub">15 Minuten</span>
        </div>
        <div class="doc-panel-body">
          <div><strong>1</strong> Lesen</div>
          <div><strong>2</strong> Einsetzen</div>
          <div><strong>3</strong> Kontrollieren</div>
        </div>
      </div>
    </section>

    <section class="doc-section reveal">
      <article id="doc-content" class="doc"></article>
    </section>

  <footer class="footer">
    <span>Übungen zur Rektion</span>
    <span>Mit Lösungen zur Selbstkontrolle</span>
  </footer>

  <script defer src="../grammatik.js"></script>

  <script>
    (() => {
      document.documentElement.classList.add("no-flash");
      const storageKey = `telc-scroll:${location.pathname}${location.search}`;
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      const save = () => {
        sessionStorage.setItem(storageKey, String(window.scrollY || window.pageYOffset || 0));
      };

      const restore = () => {
        const saved = sessionStorage.getItem(storageKey);
        if (saved == null) return;
        const y = Number(saved);
        if (!Number.isNaN(y)) {
          window.scrollTo(0, y);
        }
      };

      const scheduleRestore = () => {
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore, 60);
        setTimeout(restore, 220);
      };

      window.addEventListener("pagehide", save);
      window.addEventListener("beforeunload", save);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") save();
      });
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link || !link.href) return;
        try {
          const url = new URL(link.href, location.href);
          if (url.origin === location.origin) save();
        } catch {
          return;
        }
      });

      window.addEventListener("pageshow", scheduleRestore);
      window.addEventListener("load", scheduleRestore);
    })();
  </script>

</body>
</html>

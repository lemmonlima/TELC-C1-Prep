<!doctype html>
<html lang="de">
<head>
  <style>html,body{background:#12110f}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TELC Grammatik - Angaben in nominaler Form</title>
  <link rel="stylesheet" href="../../../../styles.css" />
    <!-- TELC Navigation System -->
  <script src="../../../../topbar.js"></script>
  <script src="../../../../navigation.js"></script>
</head>
<body class="no-js doc-page">
  <!-- La barra de navegación se genera automáticamente -->
  <main class="doc-main">
    <section class="doc-hero">
      <div class="doc-hero-text reveal">
        <div class="eyebrow">4.1 Angaben in nominaler Form</div>
        <h1>Nominale Angaben</h1>
        <p class="lead">
          Übung 21: Nominale Angaben in Nebensätze umwandeln.
        </p>
      </div>
    </section>

    <section id="exercise" class="section">
      <div class="section-head reveal">
        <h2>Übung 21</h2>
        <p>Wandeln Sie die nominalen Angaben des Textes in Nebensätze um.</p>
      </div>
      <div class="exercise-panel reveal">
        <div class="text-exercise-container">
          <div class="text-exercise-original">
            <h3>Originaltext</h3>
            <div id="original-text" class="text-exercise-text"></div>
          </div>
          
          <div class="text-exercise-input-area">
            <h3>Ihre Antwort</h3>
            <textarea id="user-answer" class="text-exercise-textarea" placeholder="Schreiben Sie hier Ihre Antwort..."></textarea>
          </div>

          <div class="text-exercise-actions">
            <button class="btn primary" id="check-answer" type="button">Prüfen</button>
            <button class="btn ghost" id="reset-answer" type="button">Zurücksetzen</button>
          </div>

          <div class="text-exercise-result" id="exercise-result" style="display: none;">
            <h3>Lösung</h3>
            <div id="correct-answer" class="text-exercise-text text-exercise-solution"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Grammatik – Angaben in nominaler Form</span>
    <span>Übung 21</span>
  </footer>

  <script defer src="exercise.js"></script>

  <script>
    (() => {
      document.documentElement.classList.add("no-flash");
      const storageKey = `telc-scroll:${location.pathname}${location.search}`;
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      const save = () => {
        sessionStorage.setItem(storageKey, String(window.scrollY || window.pageYOffset || 0));
      };

      const restore = () => {
        const saved = sessionStorage.getItem(storageKey);
        if (saved == null) return;
        const y = Number(saved);
        if (!Number.isNaN(y)) {
          window.scrollTo(0, y);
        }
      };

      const scheduleRestore = () => {
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore, 60);
        setTimeout(restore, 220);
      };

      window.addEventListener("pagehide", save);
      window.addEventListener("beforeunload", save);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") save();
      });
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link || !link.href) return;
        try {
          const url = new URL(link.href, location.href);
          if (url.origin === location.origin) save();
        } catch {
          return;
        }
      });

      window.addEventListener("pageshow", scheduleRestore);
      window.addEventListener("load", scheduleRestore);
    })();
  </script>

</body>
</html>

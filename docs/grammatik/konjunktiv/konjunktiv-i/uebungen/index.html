  <script defer src="exercise.js"></script>

  <script>
    (() => {
      document.documentElement.classList.add("no-flash");
      const storageKey = `telc-scroll:${location.pathname}${location.search}`;
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      const save = () => {
        sessionStorage.setItem(storageKey, String(window.scrollY || window.pageYOffset || 0));
      };

      const restore = () => {
        const saved = sessionStorage.getItem(storageKey);
        if (saved == null) return;
        const y = Number(saved);
        if (!Number.isNaN(y)) {
          window.scrollTo(0, y);
        }
      };

      const scheduleRestore = () => {
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore, 60);
        setTimeout(restore, 220);
      };

      window.addEventListener("pagehide", save);
      window.addEventListener("beforeunload", save);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") save();
      });
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link || !link.href) return;
        try {
          const url = new URL(link.href, location.href);
          if (url.origin === location.origin) save();
        } catch {
          return;
        }
      });

      window.addEventListener("pageshow", scheduleRestore);
      window.addEventListener("load", scheduleRestore);
    })();
  </script>

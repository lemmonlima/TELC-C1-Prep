  <script>
    (() => {
      document.documentElement.classList.add("no-flash");
      const storageKey = `telc-scroll:${location.pathname}${location.search}`;
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      const save = () => {
        sessionStorage.setItem(storageKey, String(window.scrollY || window.pageYOffset || 0));
      };

      const restore = () => {
        const saved = sessionStorage.getItem(storageKey);
        if (saved == null) return;
        const y = Number(saved);
        if (!Number.isNaN(y)) {
          window.scrollTo(0, y);
        }
      };

      const scheduleRestore = () => {
        restore();
        requestAnimationFrame(restore);
        setTimeout(restore, 60);
        setTimeout(restore, 220);
      };

      window.addEventListener("pagehide", save);
      window.addEventListener("beforeunload", save);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") save();
      });
      document.addEventListener("click", (event) => {
        const link = event.target.closest("a");
        if (!link || !link.href) return;
        try {
          const url = new URL(link.href, location.href);
          if (url.origin === location.origin) save();
        } catch {
          return;
        }
      });

      window.addEventListener("pageshow", scheduleRestore);
      window.addEventListener("load", scheduleRestore);
    })();
  </script>


  <script>
    // Topbar controls
    (function() {
      const topbar = document.querySelector('.topbar');
      if (!topbar) return;
      
      const body = document.body;
      
      // Restore hidden state
      if (sessionStorage.getItem('telc_topbar_hidden') === '1') {
        body.classList.add('topbar-hidden');
      }
      
      // Create show trigger
      const showTrigger = document.createElement('div');
      showTrigger.className = 'topbar-show-trigger';
      showTrigger.title = 'Mostrar barra';
      showTrigger.textContent = '▼';
      topbar.parentNode.insertBefore(showTrigger, topbar);
      
      // Get buttons
      const hideBtn = topbar.querySelector('.topbar-hide');
      const resetBtn = topbar.querySelector('.topbar-reset');
      
      if (hideBtn) {
        hideBtn.onclick = () => {
          body.classList.add('topbar-hidden');
          body.classList.remove('topbar-auto-hidden');
          sessionStorage.setItem('telc_topbar_hidden', '1');
        };
      }
      
      if (showTrigger) {
        showTrigger.onclick = () => {
          body.classList.remove('topbar-hidden');
          body.classList.remove('topbar-auto-hidden');
          sessionStorage.removeItem('telc_topbar_hidden');
        };
      }
      
      if (resetBtn) {
        resetBtn.onclick = () => {
          const keys = [];
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key && key.indexOf('telc_') === 0) keys.push(key);
          }
          keys.forEach(k => sessionStorage.removeItem(k));
          location.reload();
        };
      }
    })();
  </script>

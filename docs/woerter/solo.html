<!doctype html>
<html lang="de">
<head>
  <style>html,body{background:#12110f}</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TELC Wörter – Solo</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="/styles-mobile-ether.css">
  <!-- TELC Navigation System -->
  <script src="../topbar.js"></script>
  <script src="../navigation.js"></script>
</head>
<body class="no-js doc-page woerter-solo">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">TELC</span>
      <span class="brand-name">Wörter</span>
    </div>
    <nav class="nav">
      <a href="../index.html#start">Start</a>
      <a href="../grammatik/index.html">Grammatik</a>
      <a href="../texte/index.html">Texte</a>
      <a href="../notizen/index.html">Notizen</a>
      <a href="../woerter/index.html">Wörter</a>
      <a href="../pruefungen/index.html">Prüfungen</a>
    </nav>
    <a class="cta" href="../tips/einfuehrung/index.html">Einstufung</a>
    <div class="topbar-actions">
      <button type="button" class="topbar-btn topbar-hide" title="Barra minimizar" aria-label="Barra minimizar">−</button>
      <button type="button" class="topbar-btn topbar-reset" title="Reiniciar (olvidar posiciones)" aria-label="Reiniciar">↺</button>
    </div>
  </header>
  <main class="doc-main">
    <section class="doc-section">
      <article id="woerter-content" class="doc doc-relaxed" aria-busy="true"></article>
    </section>
  </main>

  <script defer src="../grammatik/grammatik.js"></script>
  <script defer src="woerter.js"></script>

  <script>
    // Topbar controls
    (function() {
      const topbar = document.querySelector('.topbar');
      if (!topbar) return;
      
      const body = document.body;
      
      // Restore hidden state
      if (sessionStorage.getItem('telc_topbar_hidden') === '1') {
        body.classList.add('topbar-hidden');
      }
      
      // Create show trigger
      const showTrigger = document.createElement('div');
      showTrigger.className = 'topbar-show-trigger';
      showTrigger.title = 'Mostrar barra';
      showTrigger.textContent = '▼';
      topbar.parentNode.insertBefore(showTrigger, topbar);
      
      // Get buttons
      const hideBtn = topbar.querySelector('.topbar-hide');
      const resetBtn = topbar.querySelector('.topbar-reset');
      
      if (hideBtn) {
        hideBtn.onclick = () => {
          body.classList.add('topbar-hidden');
          body.classList.remove('topbar-auto-hidden');
          sessionStorage.setItem('telc_topbar_hidden', '1');
        };
      }
      
      if (showTrigger) {
        showTrigger.onclick = () => {
          body.classList.remove('topbar-hidden');
          body.classList.remove('topbar-auto-hidden');
          sessionStorage.removeItem('telc_topbar_hidden');
        };
      }
      
      if (resetBtn) {
        resetBtn.onclick = () => {
          const keys = [];
          for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key && key.indexOf('telc_') === 0) keys.push(key);
          }
          keys.forEach(k => sessionStorage.removeItem(k));
          location.reload();
        };
      }
    })();
  </script>

  <!-- Mobile gestures para mejor UX táctil -->
  <script defer src="mobile-gestures.js"></script>
  <!-- Control de tamaño de nodos ajustable -->
  <script defer src="node-size-control.js"></script>
  <!-- Vista de lista para móviles -->
  <script defer src="list-view.js"></script>
  <script>
    // Activar mejoras móviles cuando el grafo esté listo
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const stage = document.querySelector('.woerter-ether-stage');
        const panel = document.querySelector('.woerter-panel');
        
        if (stage && window.etherState && typeof enhanceMobileGestures === 'function') {
          console.log('🍋 Activando gestos móviles para el grafo ether (solo)');
          enhanceMobileGestures(window.etherState, window.applyView);
          
          if (panel && typeof enhanceMobilePanel === 'function') {
            enhanceMobilePanel(panel);
          }
        }
      }, 600);
    });
  </script>

</body>
</html>

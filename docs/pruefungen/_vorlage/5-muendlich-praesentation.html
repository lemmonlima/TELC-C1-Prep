<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modelltest N - Mündliche Prüfung: Präsentation | TELC C1 Hochschule</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../shared/pruefung.css" />
  <script src="../../topbar.js"></script>
  <script src="../../navigation.js"></script>
</head>
<body>
  <main class="pruefung-container" id="section-root" data-section="praesentation" data-modell="N">

    <div data-content="teilnehmer" hidden>
      <!--
        TODO: 3 Teilnehmer (A, B, C) × 2 temas cada uno = 6 temas.
        ⚠ CONSISTENCIA: Estos temas DEBEN ser idénticos en:
        - exam.html (tab-vorbereitung)
        - exam-data.js (themaTexte)
        - praesentation-texte.js (claves a1,a2,b1,b2,c1,c2)
        - zusammenfassung.html (botones)
      -->
      <div class="teilnehmer-box">
        <div class="teilnehmer-titel">Teilnehmer/in A</div>
        <div class="thema-box">
          <div class="thema-label">Thema 1</div>
          <div class="thema-text"><p>Pregunta/tema completo para A1.</p></div>
        </div>
        <div class="thema-box">
          <div class="thema-label">Thema 2</div>
          <div class="thema-text"><p>Pregunta/tema completo para A2.</p></div>
        </div>
      </div>

      <div class="teilnehmer-box">
        <div class="teilnehmer-titel">Teilnehmer/in B</div>
        <div class="thema-box">
          <div class="thema-label">Thema 1</div>
          <div class="thema-text"><p>Pregunta/tema completo para B1.</p></div>
        </div>
        <div class="thema-box">
          <div class="thema-label">Thema 2</div>
          <div class="thema-text"><p>Pregunta/tema completo para B2.</p></div>
        </div>
      </div>

      <div class="teilnehmer-box">
        <div class="teilnehmer-titel">Teilnehmer/in C</div>
        <div class="thema-box">
          <div class="thema-label">Thema 1</div>
          <div class="thema-text"><p>Pregunta/tema completo para C1.</p></div>
        </div>
        <div class="thema-box">
          <div class="thema-label">Thema 2</div>
          <div class="thema-text"><p>Pregunta/tema completo para C2.</p></div>
        </div>
      </div>
    </div>

    <div data-content="select" hidden>
      <!-- TODO: Las claves (a1, a2, b1...) DEBEN coincidir con initPraesentation y praesentation-texte.js -->
      <optgroup label="Teilnehmer/in A">
        <option value="a1">Thema 1: Resumen corto A1</option>
        <option value="a2">Thema 2: Resumen corto A2</option>
      </optgroup>
      <optgroup label="Teilnehmer/in B">
        <option value="b1">Thema 1: Resumen corto B1</option>
        <option value="b2">Thema 2: Resumen corto B2</option>
      </optgroup>
      <optgroup label="Teilnehmer/in C">
        <option value="c1">Thema 1: Resumen corto C1</option>
        <option value="c2">Thema 2: Resumen corto C2</option>
      </optgroup>
    </div>

  </main>
  <script src="../shared/section-builders.js"></script>
  <script src="../shared/pruefung.js"></script>
  <script>
    SectionBuilder.praesentation(document.getElementById('section-root'), document.getElementById('section-root'));
    // TODO: Texto completo de cada tema (usado cuando el usuario selecciona un tema para practicar)
    Pruefung.initPraesentation({
      'a1': 'Texto completo del tema A1.',
      'a2': 'Texto completo del tema A2.',
      'b1': 'Texto completo del tema B1.',
      'b2': 'Texto completo del tema B2.',
      'c1': 'Texto completo del tema C1.',
      'c2': 'Texto completo del tema C2.'
    });
  </script>
</body>
</html>

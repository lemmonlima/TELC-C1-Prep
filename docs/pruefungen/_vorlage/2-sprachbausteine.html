<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modelltest N - Sprachbausteine | TELC C1 Hochschule</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../shared/pruefung.css" />
  <script src="../../topbar.js"></script>
  <script src="../../navigation.js"></script>
</head>
<body>
  <main class="pruefung-container" id="section-root" data-section="sb" data-modell="N">

    <div data-content="text" hidden>
      <!-- TODO: Texto académico (~250 pal.) con 23 huecos (25–47). Clase: lucke (sin ü). -->
      <h3>Título del texto</h3>

      <p>Texto <span class="lucke" data-lucke="25">____</span> más texto
      <span class="lucke" data-lucke="26">____</span> continúa...</p>

      <p>Siguiente párrafo con <span class="lucke" data-lucke="27">____</span> y
      <span class="lucke" data-lucke="28">____</span> y
      <span class="lucke" data-lucke="29">____</span> más texto
      <span class="lucke" data-lucke="30">____</span> texto
      <span class="lucke" data-lucke="31">____</span> más
      <span class="lucke" data-lucke="32">____</span></p>

      <!-- TODO: Continuar hasta Lücke 47. Distribuir los 23 huecos naturalmente en ~7 párrafos. -->
    </div>

    <div data-content="optionen" hidden>
      <!-- TODO: 4 opciones (a/b/c/d) por hueco. Las incorrectas deben ser del mismo tipo gramatical. -->
      <div data-lucke="25">
        <span data-wert="a">opción a</span>
        <span data-wert="b">opción b</span>
        <span data-wert="c">opción c</span>
        <span data-wert="d">opción d</span>
      </div>
      <div data-lucke="26">
        <span data-wert="a">opción a</span>
        <span data-wert="b">opción b</span>
        <span data-wert="c">opción c</span>
        <span data-wert="d">opción d</span>
      </div>
      <!-- TODO: Repetir para cada Lücke 27–47 con la misma estructura -->
    </div>

  </main>
  <script src="../shared/section-builders.js"></script>
  <script src="../shared/pruefung.js"></script>
  <script>
    SectionBuilder.sb(document.getElementById('section-root'), document.getElementById('section-root'));
    // TODO: Respuestas correctas (a/b/c/d) para cada hueco 25–47
    Pruefung.initSB({
      25:'_',26:'_',27:'_',28:'_',29:'_',30:'_',31:'_',32:'_',33:'_',34:'_',
      35:'_',36:'_',37:'_',38:'_',39:'_',40:'_',41:'_',42:'_',43:'_',44:'_',
      45:'_',46:'_',47:'_'
    });
  </script>
</body>
</html>
